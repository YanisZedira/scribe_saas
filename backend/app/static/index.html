<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Scribe — Vos réunions, transcrites et résumées</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f17; --bg2:#0f1522; --panel:#141b2b; --panel2:#1a2336;
  --line:#243049; --txt:#e8ecf5; --muted:#94a2bd; --faint:#64718c;
  --brand:#10b981; --brand2:#34d399; --violet:#8b5cf6; --violet2:#a78bfa;
  --amber:#f59e0b; --rose:#fb7185; --sky:#38bdf8;
  --radius:18px; --shadow:0 20px 50px -25px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#24304a;border-radius:8px}
.app{min-height:100vh}
.fade{animation:fade .45s cubic-bezier(.2,.7,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid #22304c;border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.grad-text{background:linear-gradient(110deg,var(--brand2),var(--sky) 60%,var(--violet2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:600;transition:.18s;background:#1c2740;color:var(--txt)}
.btn:hover{transform:translateY(-1px);background:#243152}
.btn-primary{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#04130d;box-shadow:0 10px 30px -10px rgba(16,185,129,.6)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-ghost:hover{background:#161f33}
.input{width:100%;padding:13px 15px;border-radius:12px;background:#0d1320;border:1px solid var(--line);color:var(--txt);transition:.15s;font-size:14.5px}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:#16213a;border:1px solid var(--line);color:var(--muted)}
.glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.4;pointer-events:none;z-index:0}
.toast{position:fixed;top:20px;right:20px;z-index:99;padding:13px 18px;border-radius:13px;font-weight:600;box-shadow:var(--shadow);animation:fade .3s}
/* layout */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#0d121e,#0a0e17);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.navlink{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--muted);font-weight:600;transition:.15s;font-size:14.5px}
.navlink:hover{background:#141d30;color:var(--txt)}
.navlink.active{background:linear-gradient(120deg,rgba(16,185,129,.18),rgba(139,92,246,.12));color:#fff;border:1px solid #1f3b52}
.main{padding:34px 40px;max-width:1080px;width:100%;margin:0 auto;position:relative;z-index:1}
.kpi{padding:20px;border-radius:16px;background:linear-gradient(160deg,var(--panel2),var(--bg2));border:1px solid var(--line)}
.seg{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #1b2438}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0;color:#04130d}
.tab{padding:9px 16px;border-radius:10px;font-weight:600;color:var(--muted);font-size:14px}
.tab.active{background:#1a2336;color:#fff}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:20px}}
</style>
</head>
<body>
<div class="glow" style="width:480px;height:480px;background:#10b981;top:-160px;left:-120px"></div>
<div class="glow" style="width:420px;height:420px;background:#8b5cf6;bottom:-160px;right:-100px"></div>
<div id="app" class="app"></div>

<script>
const API="";let TOKEN=null,USER=null,CURRENT="dashboard";
const $=(s,e=document)=>e.querySelector(s);
const h=(html)=>{const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstChild;};
const palette=["#10b981","#8b5cf6","#38bdf8","#f59e0b","#fb7185","#34d399"];
const avatarColor=(n)=>palette[(n||"?").charCodeAt(0)%palette.length];
const initials=(n)=>(n||"?").split(/\s|_/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
function fmtDur(s){if(!s)return"—";const m=Math.floor(s/60),x=Math.round(s%60);return`${m}m${String(x).padStart(2,"0")}`}
function toast(m,ok=true){const t=h(`<div class="toast" style="background:${ok?'linear-gradient(120deg,#10b981,#34d399);color:#04130d':'#fb7185;color:#1a0509'}">${m}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}
async function api(path,{method="GET",body,form,auth=true}={}){
  const hd={};if(auth&&TOKEN)hd.Authorization=`Bearer ${TOKEN}`;
  let p;if(form)p=form;else if(body){hd["Content-Type"]="application/json";p=JSON.stringify(body);}
  const r=await fetch(API+path,{method,headers:hd,body:p});
  if(!r.ok){let d;try{d=await r.json()}catch{d={detail:r.statusText}}throw new Error(d.detail||"Erreur");}
  return r.status===204?null:r.json();
}

/* ---------- AUTH / LANDING ---------- */
function viewAuth(){
  const el=h(`<div class="fade" style="min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr">
    <div style="padding:7vh 6vw;display:flex;flex-direction:column;justify-content:center">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:30px">
        <div style="width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#10b981,#8b5cf6);display:grid;place-items:center;font-size:20px">🎙️</div>
        <span class="display" style="font-size:22px;font-weight:800">Scribe</span>
      </div>
      <h1 class="display" style="font-size:clamp(34px,5vw,56px);line-height:1.05;margin-bottom:18px">Vos réunions,<br><span class="grad-text">transcrites & résumées</span><br>automatiquement.</h1>
      <p style="color:var(--muted);font-size:17px;max-width:480px;line-height:1.6">Scribe rejoint vos réunions <b style="color:#fff">Teams, Google Meet et Zoom</b> — ou capte le présentiel au micro — puis génère compte-rendu, décisions et actions grâce à des agents IA spécialisés.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:28px">
        <span class="chip">🤖 5 agents IA</span><span class="chip">🔒 RGPD by design</span><span class="chip">🌍 100+ langues</span><span class="chip">⚡ Temps réel</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;padding:5vh 4vw;background:linear-gradient(180deg,rgba(20,27,43,.5),transparent)">
      <div class="card fade" style="width:100%;max-width:400px;padding:30px">
        <div style="display:flex;gap:8px;background:#0d1320;padding:5px;border-radius:13px;margin-bottom:22px">
          <button id="tl" class="tab active" style="flex:1">Connexion</button>
          <button id="tr" class="tab" style="flex:1">Inscription</button>
        </div>
        <form id="f" style="display:flex;flex-direction:column;gap:13px">
          <input id="name" class="input" placeholder="Nom complet" style="display:none"/>
          <input id="email" class="input" type="email" placeholder="vous@entreprise.fr" required/>
          <input id="pw" class="input" type="password" placeholder="Mot de passe" required/>
          <button class="btn btn-primary" style="justify-content:center;margin-top:6px">Se connecter →</button>
        </form>
        <p style="color:var(--faint);font-size:12.5px;margin-top:16px;text-align:center">Démo gratuite · pipeline en mode simulé tant qu'aucune clé API n'est configurée.</p>
      </div>
    </div>
  </div>`);
  let mode="login";const set=(m)=>{mode=m;
    $("#tl",el).classList.toggle("active",m==="login");$("#tr",el).classList.toggle("active",m==="reg");
    $("#name",el).style.display=m==="reg"?"block":"none";
    $("#f button",el).textContent=m==="login"?"Se connecter →":"Créer mon compte →";};
  $("#tl",el).onclick=()=>set("login");$("#tr",el).onclick=()=>set("reg");
  $("#f",el).onsubmit=async(e)=>{e.preventDefault();
    const email=$("#email",el).value,password=$("#pw",el).value,full_name=$("#name",el).value;
    try{
      if(mode==="reg")await api("/api/auth/register",{method:"POST",auth:false,body:{email,password,full_name}});
      const fd=new URLSearchParams();fd.set("username",email);fd.set("password",password);
      const r=await fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:fd});
      if(!r.ok)throw new Error("Identifiants incorrects");
      TOKEN=(await r.json()).access_token;USER=await api("/api/auth/me");render();
    }catch(err){toast(err.message,false);}
  };
  return el;
}

/* ---------- SHELL ---------- */
function shell(content){
  const nav=[["dashboard","◳","Tableau de bord"],["new","✛","Nouvelle réunion"],["meetings","☰","Mes réunions"],["agents","✦","Agents IA"]];
  const el=h(`<div class="shell fade">
    <aside class="side">
      <div style="display:flex;align-items:center;gap:10px;padding:0 8px 26px">
        <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#10b981,#8b5cf6);display:grid;place-items:center;font-size:18px">🎙️</div>
        <span class="display" style="font-size:19px;font-weight:800">Scribe</span>
      </div>
      <nav style="display:flex;flex-direction:column;gap:4px">
        ${nav.map(([k,i,l])=>`<a data-nav="${k}" class="navlink ${k===CURRENT?'active':''}"><span style="width:20px;text-align:center;opacity:.9">${i}</span>${l}</a>`).join("")}
      </nav>
      <div style="margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:14px;background:#0d1320">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="av" style="background:${avatarColor(USER?.email)}">${initials(USER?.full_name||USER?.email)}</div>
          <div style="min-width:0"><div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${USER?.full_name||"Compte"}</div><div style="font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${USER?.email||""}</div></div>
        </div>
        <button id="logout" class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:11px;padding:8px;font-size:13px">Déconnexion</button>
      </div>
    </aside>
    <main class="main"></main>
  </div>`);
  $("main",el).appendChild(content);
  el.querySelectorAll("[data-nav]").forEach(a=>a.onclick=()=>route(a.dataset.nav));
  $("#logout",el).onclick=()=>{TOKEN=null;USER=null;render();};
  return el;
}

/* ---------- DASHBOARD ---------- */
async function viewDashboard(){
  const w=h(`<div class="fade"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:26px"><div><h1 style="font-size:28px">Tableau de bord</h1><p style="color:var(--muted);margin-top:4px">Vue d'ensemble de vos réunions</p></div><button class="btn btn-primary" id="new">✛ Nouvelle réunion</button></div><div id="c"><div style="display:grid;place-items:center;padding:60px"><div class="spinner"></div></div></div></div>`);
  $("#new",w).onclick=()=>route("new");
  (async()=>{try{
    const s=await api("/api/dashboard");const c=$("#c",w);c.innerHTML="";
    const kpis=[["Réunions",s.total_meetings,"🗂️","#10b981"],["Minutes traitées",s.total_minutes,"⏱️","#38bdf8"],["Actions ouvertes",s.open_actions,"✅","#f59e0b"],["Coût API",s.total_cost_eur.toFixed(3)+" €","💶","#8b5cf6"]];
    c.appendChild(h(`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:22px">${kpis.map(([l,v,i,col])=>`<div class="kpi"><div style="font-size:22px">${i}</div><div class="display" style="font-size:30px;font-weight:800;margin-top:8px;color:${col}">${v}</div><div style="color:var(--muted);font-size:13.5px;margin-top:2px">${l}</div></div>`).join("")}</div>`));
    const card=h(`<div class="card" style="padding:24px"><h3 style="font-size:17px;margin-bottom:18px">Thèmes dominants</h3><div style="height:240px"><canvas id="ch"></canvas></div><p id="empty" style="color:var(--faint);display:none;text-align:center;padding:30px">Aucune donnée — créez votre première réunion.</p></div>`);
    c.appendChild(card);
    if(s.top_themes.length){new Chart($("#ch",card),{type:"bar",data:{labels:s.top_themes.map(t=>t.label),datasets:[{data:s.top_themes.map(t=>t.score),backgroundColor:"#10b981",borderRadius:8,maxBarThickness:42}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#94a2bd"},grid:{display:false}},y:{ticks:{color:"#94a2bd"},grid:{color:"#1b2438"}}}}});}
    else{$("#ch",card).style.display="none";$("#empty",card).style.display="block";}
  }catch(e){toast(e.message,false);}})();
  return w;
}

/* ---------- NEW MEETING ---------- */
function viewNew(){
  const el=h(`<div class="fade" style="max-width:680px"><h1 style="font-size:28px;margin-bottom:6px">Nouvelle réunion</h1><p style="color:var(--muted);margin-bottom:24px">Choisissez comment Scribe capte la réunion.</p>
    <div class="card" style="padding:26px;display:flex;flex-direction:column;gap:18px">
      <input id="title" class="input" placeholder="Titre de la réunion (ex : Point produit hebdo)"/>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <button id="md" class="mode" data-m="dictaphone"><div style="font-size:26px">🎤</div><div style="font-weight:700;margin-top:8px">Dictaphone</div><div style="color:var(--muted);font-size:13px;margin-top:3px">Réunion en présentiel</div></button>
        <button id="mv" class="mode" data-m="visio"><div style="font-size:26px">📹</div><div style="font-weight:700;margin-top:8px">Visioconférence</div><div style="color:var(--muted);font-size:13px;margin-top:3px">Teams · Meet · Zoom</div></button>
      </div>
      <div id="vbox" style="display:none;flex-direction:column;gap:10px">
        <label style="font-size:13.5px;color:var(--muted);font-weight:600">Lien de la réunion</label>
        <input id="url" class="input" placeholder="https://meet.google.com/abc-defg-hij  ·  teams.live.com/meet/…  ·  zoom.us/j/…"/>
        <p style="font-size:12.5px;color:var(--faint)">Scribe enverra un bot qui rejoint la réunion et la transcrit en temps réel via Vexa.</p>
      </div>
      <label style="display:flex;gap:11px;align-items:flex-start;padding:14px;border-radius:13px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25)">
        <input id="consent" type="checkbox" style="margin-top:3px;width:17px;height:17px;accent-color:#10b981"/>
        <span style="font-size:13.5px;line-height:1.5">🔒 <b>Consentement RGPD.</b> Je confirme que tous les participants sont informés de l'enregistrement et de la transcription, et y consentent.</span>
      </label>
      <button id="go" class="btn btn-primary" style="justify-content:center">Continuer →</button>
    </div>
    <div id="cap" style="margin-top:18px"></div>
  </div>`);
  el.querySelectorAll(".mode").forEach(b=>{b.style.cssText="text-align:left;padding:18px;border-radius:15px;background:#0f1626;border:1.5px solid var(--line);transition:.15s";});
  let mode="dictaphone";
  const pick=(m)=>{mode=m;el.querySelectorAll(".mode").forEach(b=>{const on=b.dataset.m===m;b.style.borderColor=on?"#10b981":"var(--line)";b.style.background=on?"rgba(16,185,129,.1)":"#0f1626";});$("#vbox",el).style.display=m==="visio"?"flex":"none";};
  $("#md",el).onclick=()=>pick("dictaphone");$("#mv",el).onclick=()=>pick("visio");pick("dictaphone");
  $("#go",el).onclick=async()=>{
    if(!$("#consent",el).checked)return toast("Le consentement RGPD est obligatoire.",false);
    const title=$("#title",el).value.trim()||"Réunion sans titre";
    const url=$("#url",el).value.trim();
    if(mode==="visio"&&!url)return toast("Collez le lien de la réunion.",false);
    try{
      const m=await api("/api/meetings",{method:"POST",body:{title,mode,language:"fr",consent_obtained:true}});
      mode==="dictaphone"?capDicta(el,m):capVisio(el,m,url);
    }catch(e){toast(e.message,false);}
  };
  return el;
}
function capDicta(el,m){
  const box=$("#cap",el);box.innerHTML="";
  const c=h(`<div class="card fade" style="padding:26px;text-align:center"><h3 style="margin-bottom:6px">🎤 ${m.title}</h3><div id="st" style="color:var(--muted);margin-bottom:18px">Prêt à enregistrer.</div>
    <div style="display:flex;gap:10px;justify-content:center"><button id="rec" class="btn btn-primary">● Démarrer</button><button id="stop" class="btn btn-ghost" style="display:none">■ Arrêter & analyser</button></div>
    <div style="margin-top:14px;color:var(--faint);font-size:13px">ou <label style="color:var(--brand2);cursor:pointer;text-decoration:underline">importer un fichier audio<input id="file" type="file" accept="audio/*" style="display:none"></label></div></div>`);
  box.appendChild(c);let rec,chunks=[];
  $("#rec",c).onclick=async()=>{try{const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.start();$("#st",c).innerHTML='<span style="color:#fb7185">🔴 Enregistrement…</span>';$("#rec",c).style.display="none";$("#stop",c).style.display="inline-flex";}catch{toast("Micro indisponible — importez un fichier.",false);}};
  $("#stop",c).onclick=()=>{rec.stop();rec.onstop=()=>up(new Blob(chunks,{type:"audio/webm"}),"rec.webm");};
  $("#file",c).onchange=e=>{if(e.target.files[0])up(e.target.files[0],e.target.files[0].name);};
  async function up(blob,name){$("#st",c).innerHTML='<div style="display:flex;gap:10px;justify-content:center;align-items:center"><div class="spinner"></div> Transcription & analyse par les agents IA…</div>';const fd=new FormData();fd.append("file",blob,name);try{await api(`/api/meetings/${m.id}/dictaphone`,{method:"POST",form:fd});poll(m.id);}catch(e){toast(e.message,false);$("#st",c).textContent="Erreur : "+e.message;}}
}
function capVisio(el,m,url){
  const box=$("#cap",el);box.innerHTML="";
  const c=h(`<div class="card fade" style="padding:26px;text-align:center"><div id="st"><div style="display:flex;gap:10px;justify-content:center;align-items:center"><div class="spinner"></div> Envoi du bot dans la réunion…</div></div></div>`);
  box.appendChild(c);
  const fd=new FormData();fd.append("meeting_url",url);
  api(`/api/meetings/${m.id}/visio`,{method:"POST",form:fd}).then(()=>{
    $("#st",c).innerHTML=`<div style="font-size:30px">🤖</div><h3 style="margin:10px 0 6px">Le bot Scribe a rejoint la réunion</h3><p style="color:var(--muted);margin-bottom:18px">Il transcrit en temps réel. Cliquez ci-dessous une fois la réunion terminée pour générer le compte-rendu.</p><button id="fin" class="btn btn-primary" style="margin:0 auto">Terminer & générer le compte-rendu</button>`;
    $("#fin",c).onclick=()=>{$("#st",c).innerHTML='<div style="display:flex;gap:10px;justify-content:center;align-items:center"><div class="spinner"></div> Récupération du transcript & analyse IA…</div>';api(`/api/meetings/${m.id}/finalize`,{method:"POST"}).then(()=>poll(m.id)).catch(e=>toast(e.message,false));};
  }).catch(e=>{$("#st",c).innerHTML=`<div style="color:#fb7185">❌ ${e.message}</div>`;});
}
function poll(id){const iv=setInterval(async()=>{const m=await api(`/api/meetings/${id}`);if(m.status==="done"){clearInterval(iv);route("meeting",id);}if(m.status==="failed"){clearInterval(iv);toast("Échec : "+(m.error_message||""),false);}},1200);}

/* ---------- MEETINGS LIST ---------- */
async function viewMeetings(){
  const w=h(`<div class="fade"><h1 style="font-size:28px;margin-bottom:22px">Mes réunions</h1><div id="l"><div style="display:grid;place-items:center;padding:50px"><div class="spinner"></div></div></div></div>`);
  try{const ms=await api("/api/meetings");const l=$("#l",w);l.innerHTML="";
    if(!ms.length){l.appendChild(h(`<div class="card" style="padding:40px;text-align:center;color:var(--muted)">Aucune réunion pour l'instant.<br><button class="btn btn-primary" style="margin:16px auto 0" onclick="">Créer ma première réunion</button></div>`));$(".btn",l).onclick=()=>route("new");return w;}
    const wrap=h(`<div style="display:flex;flex-direction:column;gap:12px"></div>`);
    ms.forEach(m=>{const col={done:"#10b981",failed:"#fb7185"}[m.status]||"#f59e0b";const lab={done:"Terminé",failed:"Échec",recording:"En cours",analyzing:"Analyse",transcribing:"Transcription"}[m.status]||m.status;
      const r=h(`<div class="card" style="padding:16px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.15s"><div style="display:flex;align-items:center;gap:14px"><div style="width:42px;height:42px;border-radius:12px;background:#0f1626;display:grid;place-items:center;font-size:20px">${m.mode==='visio'?'📹':'🎤'}</div><div><div style="font-weight:600">${m.title}</div><div style="color:var(--faint);font-size:13px;margin-top:2px">${m.platform||m.mode} · ${fmtDur(m.duration_sec)} · ${new Date(m.started_at).toLocaleDateString('fr-FR')}</div></div></div><span class="chip" style="color:${col};border-color:${col}33;background:${col}14">● ${lab}</span></div>`);
      r.onmouseenter=()=>r.style.transform="translateX(4px)";r.onmouseleave=()=>r.style.transform="";
      r.onclick=()=>route("meeting",m.id);wrap.appendChild(r);});
    l.appendChild(wrap);
  }catch(e){toast(e.message,false);}
  return w;
}

/* ---------- MEETING DETAIL ---------- */
async function viewMeeting(id){
  const w=h(`<div class="fade"><div style="display:grid;place-items:center;padding:50px"><div class="spinner"></div></div></div>`);
  try{const m=await api(`/api/meetings/${id}`);w.innerHTML="";
    const toneIcon={positif:"😊",négatif:"😟",neutre:"😐"}[m.overall_tone]||"💬";
    const nameOf=(sid)=>{const s=m.speakers.find(x=>x.id===sid);return s?(s.display_name||s.label):"?";};
    w.appendChild(h(`<button class="btn btn-ghost" style="padding:8px 14px;font-size:13px;margin-bottom:16px" id="back">← Mes réunions</button>`));
    $("#back",w).onclick=()=>route("meetings");
    w.appendChild(h(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px"><div><h1 style="font-size:26px">${m.title}</h1><div style="color:var(--muted);margin-top:6px;font-size:14px">${m.mode==='visio'?'📹':'🎤'} ${m.platform||m.mode} · ${fmtDur(m.duration_sec)} · ${toneIcon} ${m.overall_tone||''} · <span style="color:var(--faint)">${m.cost_eur.toFixed(3)} €</span></div></div><button id="del" class="btn btn-ghost" style="font-size:13px;color:#fb7185">🗑️ Supprimer</button></div>`));
    $("#del",w).onclick=async()=>{if(confirm("Supprimer définitivement (droit à l'effacement RGPD) ?")){await api(`/api/meetings/${id}`,{method:"DELETE"});route("meetings");}};
    // tabs
    const tabs=h(`<div style="display:flex;gap:6px;background:#0d1320;padding:5px;border-radius:13px;margin-bottom:18px;width:fit-content"><button class="tab active" data-t="cr">📝 Compte-rendu</button><button class="tab" data-t="tr">📜 Transcription</button><button class="tab" data-t="in">💡 Insights</button></div>`);
    w.appendChild(tabs);const body=h(`<div></div>`);w.appendChild(body);
    const renderTab=(t)=>{tabs.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.t===t));body.innerHTML="";
      if(t==="cr"){
        const crHtml=(m.summary_md||"").replace(/^# .*$/m,"").replace(/^## (.*)$/gm,'<h3 style="font-size:15px;margin:16px 0 8px;color:var(--brand2)">$1</h3>').replace(/^- (.*)$/gm,'<div style="padding:3px 0 3px 16px;border-left:2px solid #243049;margin:3px 0">$1</div>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/_(.*?)_/g,'<span style="color:var(--faint)">$1</span>').replace(/\n/g,"");
        body.appendChild(h(`<div class="card fade" style="padding:24px;margin-bottom:16px"><div style="font-size:14.5px;line-height:1.7">${crHtml}</div></div>`));
        if(m.actions.length){const pc={haute:"#fb7185",normale:"#f59e0b",basse:"#64718c"};
          const a=h(`<div class="card fade" style="padding:24px;margin-bottom:16px"><h3 style="font-size:16px;margin-bottom:14px">✅ Plan d'action</h3><div data-acts style="display:flex;flex-direction:column;gap:9px"></div></div>`);
          const acts=$("[data-acts]",a);
          m.actions.forEach(act=>{const r=h(`<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:#0f1626;border:1px solid var(--line);border-radius:12px"><div style="font-size:14px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${pc[act.priority]||'#f59e0b'};margin-right:8px"></span><b>${act.assignee||'—'}</b> · ${act.description} <span style="color:var(--faint)">${act.due_date?'· '+new Date(act.due_date).toLocaleDateString('fr-FR'):''}</span></div><select class="input" style="width:auto;padding:6px 10px;font-size:12.5px"><option value="open" ${act.status==='open'?'selected':''}>À faire</option><option value="in_progress" ${act.status==='in_progress'?'selected':''}>En cours</option><option value="done" ${act.status==='done'?'selected':''}>Fait</option></select></div>`);
            $("select",r).onchange=e=>api(`/api/meetings/actions/${act.id}?status_value=${e.target.value}`,{method:"PATCH"}).then(()=>toast("Action mise à jour")).catch(x=>toast(x.message,false));
            acts.appendChild(r);});
          body.appendChild(a);}
        const grid=h(`<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="fade"></div>`);
        grid.appendChild(h(`<div class="card" style="padding:22px"><h3 style="font-size:15px;margin-bottom:12px">🏷️ Thèmes</h3><div style="display:flex;flex-wrap:wrap;gap:8px">${m.themes.map(t=>`<span class="chip" style="color:var(--violet2);border-color:#8b5cf633;background:#8b5cf614">${t.label}</span>`).join("")||'<span style="color:var(--faint)">—</span>'}</div></div>`));
        grid.appendChild(h(`<div class="card" style="padding:22px"><h3 style="font-size:15px;margin-bottom:12px">🗣️ Temps de parole</h3>${m.speakers.map(s=>{const tot=m.speakers.reduce((a,x)=>a+x.talk_time_sec,0)||1;const pct=Math.round(s.talk_time_sec/tot*100);return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${s.display_name||s.label}</span><span style="color:var(--faint)">${fmtDur(s.talk_time_sec)}</span></div><div style="height:7px;background:#0f1626;border-radius:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${avatarColor(s.display_name||s.label)};border-radius:6px"></div></div></div>`;}).join("")||'<span style="color:var(--faint)">—</span>'}</div>`));
        body.appendChild(grid);
      } else if(t==="tr"){
        const tr=h(`<div class="card fade" style="padding:22px;max-height:560px;overflow-y:auto"></div>`);
        m.segments.forEach(s=>{const nm=nameOf(s.speaker_id);tr.appendChild(h(`<div class="seg"><div class="av" style="background:${avatarColor(nm)}">${initials(nm)}</div><div><div style="font-size:13px;margin-bottom:2px"><b style="color:#fff">${nm}</b> <span style="color:var(--faint);font-size:11.5px">${fmtDur(s.start_sec)}</span></div><div style="font-size:14px;color:var(--txt)">${s.text}</div></div></div>`));});
        body.appendChild(tr);
      } else {
        const I=m.insights||{};const block=(t,items,col,ic)=>`<div class="card" style="padding:22px"><h3 style="font-size:15px;margin-bottom:12px">${ic} ${t}</h3>${(items&&items.length)?items.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #1b2438;font-size:14px"><span style="color:${col}">●</span> ${x}</div>`).join(""):'<span style="color:var(--faint)">Aucun élément détecté.</span>'}</div>`;
        body.appendChild(h(`<div class="fade" style="display:flex;flex-direction:column;gap:16px">${block("Risques",I.risks,"#fb7185","⚠️")}${block("Points de suivi",I.follow_ups,"#f59e0b","🔁")}${block("Prochaines étapes",I.next_steps,"#10b981","➡️")}${(m.decisions&&m.decisions.length)?block("Décisions actées",m.decisions,"#38bdf8","✔️"):""}</div>`));
      }};
    tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>renderTab(b.dataset.t));renderTab("cr");
  }catch(e){toast(e.message,false);}
  return w;
}

/* ---------- AGENTS ---------- */
async function viewAgents(){
  const w=h(`<div class="fade"><h1 style="font-size:28px;margin-bottom:6px">Agents IA</h1><p style="color:var(--muted);margin-bottom:24px">Chaque agent a une spécialité unique et un prompt JSON dédié pour des résultats fiables.</p><div id="l"><div style="display:grid;place-items:center;padding:50px"><div class="spinner"></div></div></div></div>`);
  try{const d=await api("/api/agents",{auth:false});const l=$("#l",w);l.innerHTML="";
    const icons={speaker:"🧑‍🤝‍🧑",classifier:"🏷️",summarizer:"📝",action:"✅",insights:"💡"};
    const grid=h(`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px"></div>`);
    d.agents.forEach(a=>{grid.appendChild(h(`<div class="card" style="padding:22px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><div style="width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#10b98133,#8b5cf633);display:grid;place-items:center;font-size:19px">${icons[a.name]||"✦"}</div><div style="font-weight:700;text-transform:capitalize">${a.name}</div></div><p style="color:var(--muted);font-size:13.5px;line-height:1.5;margin-bottom:12px">${a.specialty}</p><details><summary style="cursor:pointer;color:var(--brand2);font-size:13px;font-weight:600">Voir le prompt JSON</summary><pre style="white-space:pre-wrap;font-size:11.5px;color:var(--faint);margin-top:10px;background:#0b1018;padding:12px;border-radius:10px;border:1px solid var(--line)">${a.system_prompt.replace(/</g,"&lt;")}</pre></details></div>`));});
    l.appendChild(grid);
  }catch(e){toast(e.message,false);}
  return w;
}

/* ---------- ROUTER ---------- */
async function route(name,arg){CURRENT=name;const v={dashboard:viewDashboard,new:viewNew,meetings:viewMeetings,meeting:()=>viewMeeting(arg),agents:viewAgents};const content=await(v[name]||viewDashboard)();const r=$("#app");r.innerHTML="";r.appendChild(shell(content));}
function render(){const r=$("#app");r.innerHTML="";if(!TOKEN)r.appendChild(viewAuth());else route("dashboard");}
render();
</script>
</body>
</html>
